# config_sft.yaml — Kaggle 2x T4 (15GB each)
# Dataset: opencode_sft_filtered_sl4096_10000.jsonl (response ≤4096 tok, prompt overhead ~800 tok)
# NOTE: edit THIS file — don't overwrite from a notebook %%writefile; a hand-rolled
# copy once dropped a config field and silently disabled a fix.
#
# Loss: plain cross-entropy (src/trainers/utils/loss_helper.py:ce_loss). DFT
# was tried and reverted — it locks newly added special tokens (<think>/
# <answer>) at p≈0 forever, since its gradient is scaled by the model's own
# (near-zero) token probability. See docs/dft-special-token-lockout.md.

# ========== Model Parameters ==========
model_params:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"
  model_type: "AutoModelForCausalLM"
  trust_remote_code: true

  # Quantization — keep false for multi-GPU DDP (bitsandbytes incompatible with DDP wrapping)
  # Re-enable load_in_4bit only for single-GPU inference/training
  load_in_8bit: false
  load_in_4bit: false
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

  # LoRA (optional)
  use_lora: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj


# ========== DataLoader Parameters ==========
dataloader_params:
  batch_size: 1                         # per-GPU; bs=2 @ ml=6000 and bs=1 @ ml=5000 both OOM on 15GB T4 (verified 2026-07-04)
  max_length: 4096                      # NOTE: ml=4096 OOM'd on one of two identical runs (dxjxtj8v crashed <10 steps,
                                        # xvf3e52l survived to step 200) — right on the memory edge. 3584 adds margin
                                        # and was the last verified-stable value; revert here if a fresh Kaggle run OOMs.
  drop_overlong: true                   # drop the ~14% of samples >4096 tok instead of truncating (truncation strips EOS)
  shuffle: true
  num_workers: 2                        # Kaggle is CPU-limited
  prefetch_factor: 2
  pin_memory: true
  pre_tokenize: true

# ========== Training Hyperparameters ==========
training_params:
  # Optimization
  learning_rate: 2e-5
  lr_scheduler: "cosine"
  warmup_steps: 50
  optimizer: "adamw_8bit"               # bitsandbytes 8-bit optimizer states (DDP-safe) — saves ~1.5GB vs torch AdamW
  weight_decay: 0.0
  max_grad_norm: 1.0

  # Training loop
  num_epochs: 2                        # ~216 steps/epoch at ml=4096/grad_accum=16 (was ~92 at the previous
                                       # ml=3584/grad_accum=32 settings — recompute if either changes again).
                                       # 3 epochs risks the 12h Kaggle cap (nothing gets pushed if the session
                                       # is killed) — resume epoch 3 next session
  gradient_accumulation_steps: 16      # effective batch = batch_size 1 * 2 GPUs * 16 = 32
  num_gpus: 2

  # Mixed precision & performance
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true         # required to fit training in 15GB

  # Logging & checkpointing
  output_dir: "./outputs/sft_run1"
  logging_steps: 10
  save_steps: 150                       # mid-epoch resume checkpoint (only latest kept)
  eval_steps: 100
  save_best_k: 2                        # keep only the 2 best epoch checkpoints (lowest val loss)
  wandb_project: "my_sft_project_v4"    # fresh project — v3 has 12 runs from the DFT-lockout debugging cycle
  wandb_run_name: "qwen0.5_sft_10k_ce_sl3584"
  mlflow_tracking_uri: null
  mlflow_experiment: "sft_training"

  # ── Kaggle Model Hub upload (best checkpoint pushed after training) ──
  push_to_kaggle: true
  # "<kaggle-username>/<model-slug>/<framework>/<variation>"
  kaggle_model_handle: "ramprasathk07/issuefix-sft/transformers/qwen0.5-sft"
  kaggle_model_license: "apache-2.0"
