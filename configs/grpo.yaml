# Kaggle 2x T4 GRPO preset. Launch with `python train.py --method grpo ...`;
# train.py creates one DDP process per GPU.
model_params:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"
  model_type: "AutoModelForCausalLM"
  trust_remote_code: true
  load_in_8bit: false
  load_in_4bit: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  # PPO-style likelihood ratios should be deterministic for a fixed sequence.
  lora_dropout: 0.0
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

dataloader_params:
  # Prompts per GPU. Each prompt expands to num_generations rollouts; policy
  # scoring is separately micro-batched by forward_batch_size below.
  batch_size: 1
  max_length: 2048
  shuffle: true
  num_workers: 0
  pin_memory: false
  pre_tokenize: false

training_params:
  learning_rate: 1e-5
  num_epochs: 1
  bf16: false
  fp16: true
  tf32: false
  weight_decay: 0.0
  max_grad_norm: 1.0
  gradient_accumulation_steps: 2
  warmup_steps: 25
  lr_scheduler: "cosine"
  optimizer: "adamw_8bit"
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 100
  output_dir: "./outputs/grpo_run1"
  wandb_project: "issuefix_grpo"
  wandb_run_name: "qwen0.5_grpo_lora_dual_t4"
  num_gpus: 2

grpo_params:
  num_generations: 4
  max_prompt_length: 1536
  max_completion_length: 512
  forward_batch_size: 1
  temperature: 1.0
  top_p: 1.0
  beta: 0.0
  epsilon: 0.2
  advantage_epsilon: 1e-4
  loss_type: "dapo"
  mask_truncated_completions: true
  format_reward_weight: 0.2
  syntax_reward_weight: 0.2
  reference_reward_weight: 0.6
  log_completions: true
  seed: 42
